[project]
name = "habib-os"
version = "0.1.0"
description = "AI-first operations workspace for Habib Distribution — read-only Amazon (DataDoe) + Supabase truth store, built around the Hermes Mac desktop app."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.4",
    "pgvector==0.4.2",
    "polars==1.41.2",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "sqlalchemy==2.0.50",
    "structlog==26.1.0",
    "supabase==2.31.0",
    "tenacity==9.1.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
