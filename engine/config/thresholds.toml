# Habib OS — operator thresholds (LOCAL substitute for the Supabase `config` table).
#
# WHY THIS FILE EXISTS
#   Supabase is deferred (see ROADMAP.md "Supabase deferral"). Until the `config`
#   table exists, money-touching thresholds live here so the agent can read real,
#   operator-set values instead of guessing.
#
# HARD RULE (CLAUDE.md): the agent NEVER invents a threshold. A value left empty
#   ("" or absent) means REFUSE the answer that needs it — it is NOT a default.
#   Fill every value below with your real number before relying on a skill that
#   reads it. Numbers are policy, not secrets — committing your real values is fine
#   and keeps them reviewable.
#
# KEYED BY MARKETPLACE (mirrors the future `config (key, marketplace)` grain).
# Migrating to Supabase later: each [marketplace.<code>] key/value becomes one
#   `config` row with marketplace = <code>.
#
# SYNC (merge 2026-06-09): `state/targets.md` is the HUMAN dial — tiered ACOS postures
#   (hero/maintain/cut), inventory weeks-of-cover, listing benchmarks, margin floors,
#   read by the prose skills. THIS file is the MACHINE mirror the engine CLI enforces for
#   the hard ad ceilings (acos/tacos) + waste trigger. Keep the ad ceilings here in sync
#   with the "Advertising" section of targets.md.
#
# MARGIN GATE (D-01a): there is NO per-tier ceiling table. The margin-tiered safety gate
#   is ONE floor (`min_net_margin_pct` below) plus the per-SKU formula
#   `tacos_ceiling = contribution_margin% - min_net_margin_pct`, derived live from each
#   SKU's own landed COGS in `engine/config/sku_catalog.toml`. A missing floor or a
#   missing/zero COGS => typed refusal, never a default.

[marketplace.CA]            # amazon.ca (CAD) — your only active marketplace today
# Minimum acceptable net margin % the gate protects (D-07/D-07a). The margin-tiered
#   safety gate refuses any spend-increase that would push net margin below this floor.
min_net_margin_pct = 15
# ACOS ceiling % above which ad spend is flagged, e.g. 35.0
# D-09: operator-adopted recommendation (30% conservative catalog-wide break-even-ACOS
#   proxy for a food/sweets catalog). NOT a runtime-invented value — TUNE after the
#   first real TACOS-by-SKU answer reveals the actual distribution.
acos_ceiling_pct = 30
# TACOS ceiling % (total ad cost of sales), e.g. 15.0
# D-09: operator-adopted recommendation (15% healthy band for an established, non-launch
#   catalog). TUNE after the first real answer; eventually per-SKU break-even at Phase 3.5.
tacos_ceiling_pct = 15
# Days-of-cover floor: a SKU is REFUSED from any spend-INCREASE below this cover —
#   (on-hand + inbound) / velocity. 42 = 6 weeks x 7 (D-03, the "maintain" tier from
#   state/targets.md:23 min_weeks_cover_maintain: 6). FLIPPED LIVE in Phase 9 (was "").
#   refuse-never-default: a MISSING floor REFUSES, never assumes a default (the asymmetry
#   vs the magnitude cap below, where empty = permissive). The cover gate (Plan 02) reads
#   this and routes a sub-cover spend-up to a typed refusal, surfacing the actual cover.
days_of_cover_floor = 42
# Conversion-rate floor % below which a SKU is REFUSED from any spend-INCREASE (D-05).
#   PROVISIONAL — mirrors state/targets.md:34 conversion_benchmark: 12%; retune to the
#   portfolio top-quartile conversion after a sales_and_traffic pull. This is a HARD
#   refusal this phase (not advisory): the conversion gate (Plan 02) reads this and routes
#   a sub-benchmark spend-up to a typed refusal. ADDED to the machine mirror in Phase 9 so
#   the engine can read it via thresholds.read (it previously lived ONLY in targets.md).
conversion_benchmark = 12
# Spend with zero attributed orders that triggers a "wasted spend" flag (CAD), e.g. 5.00
# Mirrors targets.md `waste_flag_min_spend: 10` (low-volume catalog -> low bar).
zero_conversion_spend_trigger = 10
# Reversible-write magnitude cap: the max bounded-% change a single reversible apply may make
#   (e.g. a bid-down's % vs the prior bid). EMPTY ("") = PERMISSIVE — the cap passes at ANY
#   magnitude (D-01/D-02 seeded permissive; a reversible move can be undone, so this is a
#   future tightening dial, not a launch guard). Unlike the margin floor above, an EMPTY
#   value here means PASS, not refuse (the documented asymmetry — see magnitude.py). To start
#   capping reversible moves, set a number (e.g. 50 = refuse any move over 50%); the cap then
#   REFUSES an over-cap move (never clamps). Tightening is a config edit, not a code change.
# FLIPPED LIVE in Phase 9 (D-01): a reversible bid/budget-down steeper than -50% per action is
#   REFUSED and routed to explicit review (equal-to-cap passes — strict greater-than breach,
#   never clamped, mirror magnitude.py:65).
max_reversible_pct_change = 50
