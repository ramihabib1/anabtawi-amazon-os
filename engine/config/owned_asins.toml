# Habib OS — OWNED-ASIN denylist: the dedicated authoritative source (D-06 / D-06a, EXEC-01).
#
# WHAT THIS IS
#   The own-ASIN self-cannibalization guard (`denylist.py`) reads this file to refuse any
#   reversible ad write whose TARGET is one of OUR OWN ASINs — advertising an Anabtawi
#   product against our own page wastes spend and cannibalizes organic. A payload that
#   targets an ASIN listed here is a HARD GateRefusal(own_asin_denied) BEFORE BUILD->DRYRUN
#   (D-07) — never a warn-and-confirm.
#
# WHY A DEDICATED FILE (operator decision, 2026-06-22, RESEARCH Open Q4 / D-06a)
#   The owned set is read from THIS dedicated file, NOT from engine/config/sku_catalog.toml.
#   The two are deliberately DECOUPLED:
#     - sku_catalog.toml  -> the 16 COGS-gated SKUs the MARGIN GATE funds (Phase 7). It is
#                            intentionally narrow: only SKUs with a reviewed landed COGS.
#     - owned_asins.toml  -> EVERY owned ASIN the denylist must refuse an ad from targeting.
#                            This is BROADER than the COGS catalog (it includes owned ASINs
#                            with no reviewed COGS, and the named private-label exclusion).
#   Keeping them separate means Phase 7's COGS semantics stay clean while the denylist still
#   covers the full owned surface.
#
# PROVENANCE (D-06a) — seeded from the AUTHORITATIVE SKU->ASIN table in
#   .claude/skills/anabtawi-context/SKILL.md (lines 34-61, the SKU/ASIN/Tier authority)
#   PLUS the named private-label exclusion B07TV972JT (the Alreef #1 assorted ASIN — owned,
#   must be excluded from ALL SP/SB/SD targeting, per
#   brain/raw/2026-06-17_baklava-rebuild-research.md).
#
# HARD RULE (CLAUDE.md #4): NEVER invent an ASIN. Every ASIN below is copied verbatim from
#   the authoritative table above. The inactive remnant SKUs (ZK-4NDS-MNA9, OA-26MX-IHV0,
#   5G-ZW6Q-WOZG, 9J-ASSK-BVKC, FO-SE3J-T74M) carry NO ASIN in that table and so contribute
#   no row here — a missing ASIN is surfaced (it simply isn't denied), never guessed.
#
# COMPLETENESS NOTE (the documented gap, D-06a): this seeds the 25 ASINs that ARE
#   authoritative in the SKU->ASIN table + B07TV972JT = 26 ASINs. If the full owned catalog
#   later confirms additional ASINs (e.g. once the remnant SKUs are mapped), ADD them here —
#   tightening the denylist is a config edit, not a code change.
#
# KEYED BY ASIN. Each [owned."<ASIN>"] row carries only public catalog metadata (brand /
#   sku / product) — NEVER the seller UUID or any secret (hard rule 5, T-08-09). ASINs are
#   public, so committing them is fine and keeps the denylist reviewable.

