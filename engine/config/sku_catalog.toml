# Habib OS — per-SKU catalog: the SINGLE MACHINE-READABLE SOURCE OF TRUTH (D-04 / D-05).
#
# WHAT THIS IS
#   The margin-tiered safety gate reads three things from this file at runtime:
#     1. the canonical SKU set   — a SKU absent here is a REFUSAL on funding
#                                  (`sku_not_in_catalog`), never a silent default (D-05).
#     2. each SKU's `tier`        — HERO / MAINTAIN / CUT (drives PPC + restock posture).
#     3. each SKU's `cogs`        — landed cost in CAD, used to compute contribution
#                                  margin LIVE. A 0 / missing cogs => `no_margin` refusal.
#
# WHAT THIS FILE DOES *NOT* STORE (D-04, anti-pattern)
#   No per-SKU margin. Margin is computed LIVE in the gate (Plan 03) from the SKU's
#   real window economics; storing a margin here would let it drift from the truth.
#   Only `asin`, `tier`, `cogs` per row — nothing pre-computed.
#
# SINGLE SOURCE OF TRUTH (D-05)
#   The prose SKU table in `.claude/skills/anabtawi-context/SKILL.md` RENDERS FROM this
#   file. Edit tier / COGS / the SKU set HERE and mirror into the prose table, never the
#   reverse. The prose table can no longer silently disagree with the gate's input.
#
# COGS PROVENANCE (landed)
#   `cogs` = landed `cogs_total_value` (CAD) — the reviewed landed cost per unit. Values
#   here are reconciled from the committed, human-reviewed SKU deep-dive / rebuild packets
#   in `deliverables/sku-deep-dives/` and the listing-audit rollup
#   `deliverables/listing-audits/_rollup_2026-06-01.md` (the SKU->ASIN->tier authority).
#   These trace to DataDoe `amazon_listings_with_cogs` / `amazon_profit_by_sku_and_date`
#   (premium Profit-by-SKU, landed cogs_total_value). When the live landed-COGS export
#   (b18aadfd) is wired, refresh these numbers here and re-mirror the prose table.
#
# HARD RULE (CLAUDE.md #4): never invent a COGS. A SKU with NO reviewed landed COGS is
#   OMITTED from this file on purpose — a funding attempt then yields a `sku_not_in_catalog`
#   refusal (D-05), which is the correct, surfaced behavior. It is NEVER given a guessed
#   cogs. The inactive remnant group (ZK-4NDS-MNA9, OA-26MX-IHV0, 5G-ZW6Q-WOZG,
#   9J-ASSK-BVKC, FO-SE3J-T74M) has no COGS and is therefore ABSENT here by the same rule.
#
# RECONCILIATION (D-04, 2026-06-21)
#   Reconciled three SKU sources into this one file:
#     - the SKU->ASIN->tier rollup (25 active ASINs, the tier authority)
#     - the per-SKU landed COGS in the reviewed deep-dive / rebuild packets
#     - engine/tests/fixtures/ca_catalog_skus.txt (22 export-observed SKUs)
#   A SKU is included here ONLY if it has BOTH a tier (rollup) AND a reviewed landed COGS
#   (deep-dive). Catalog SKUs lacking a reviewed COGS are intentionally omitted so they
#   refuse on funding until a real landed cost is supplied. Final count: 16 SKUs.
#
# KEYED BY SKU. Migrating to Supabase later: each [sku."<SKU>"] becomes one `sku_master`
#   row (sku, asin, tier) joined to its `cogs` row, marketplace = CA.

